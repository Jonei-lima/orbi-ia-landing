<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo documento · ORBI IA</title><meta name="robots" content="noindex">
<link rel="icon" href="/orbi/img/orbi-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/cozinhagourmet/contrato/doc.css">
<link rel="stylesheet" href="/orbi/contrato/orbi.css">
</head><body><main style="max-width:680px">
<img class="logo" src="/orbi/img/orbi-logo-branco.png" alt="ORBI IA">
<p class="eyebrow" style="text-align:center">Área da organização · não compartilhe este link</p>
<h1>Novo contrato</h1>
<p class="muted">Preencha os dados do cliente. O documento nasce como rascunho: na próxima tela você revisa o texto e libera o link.</p>
<form id="f">
  <label for="modelo"><b>Modelo</b></label>
  <select id="modelo" required>
    <option value="orbi_sdr">Contrato de prestação de serviços · Agentes SDR e Atendimento (WhatsApp)</option>
  </select>
  <div class="row two">
    <div><label for="cnpj"><b>CNPJ</b> (preenche razão social e endereço)</label><input id="cnpj" type="text" inputmode="numeric"></div>
    <div><label for="foro"><b>Foro</b> (cidade/UF)</label><input id="foro" type="text" placeholder="Piracicaba/SP"></div>
  </div>
  <div class="row two">
    <div><label for="razao"><b>Razão social</b></label><input id="razao" type="text"></div>
    <div><label for="fantasia"><b>Nome da marca</b> (como aparece no texto)</label><input id="fantasia" type="text"></div>
  </div>
  <label for="endereco"><b>Endereço</b></label><input id="endereco" type="text">
  <div class="row two">
    <div><label for="representante"><b>Representante</b> (nome completo)</label><input id="representante" type="text"></div>
    <div><label for="whatsapp"><b>WhatsApp do representante</b></label><input id="whatsapp" type="tel" inputmode="numeric" placeholder="(19) 99999-9999"></div>
  </div>
  <div class="row two">
    <div><label for="valor"><b>Implantação</b> (R$)</label><input id="valor" type="text" inputmode="decimal" placeholder="1.200,00"></div>
    <div><label for="pagamento"><b>Forma de pagamento da implantação</b></label><input id="pagamento" type="text" value="à vista ou em até 3 (três) vezes no cartão de crédito"></div>
  </div>
  <div class="row two">
    <div><label for="mensalidade"><b>Mensalidade</b> (R$)</label><input id="mensalidade" type="text" inputmode="decimal" placeholder="275,00"></div>
    <div><label for="vencimento"><b>Dia de vencimento</b></label><input id="vencimento" type="text" inputmode="numeric" value="10"></div>
  </div>
  <div class="row two">
    <div><label for="renovacao"><b>Renovação a cada 12 meses</b> (R$)</label><input id="renovacao" type="text" inputmode="decimal" placeholder="760,00"></div>
    <div><label for="volume"><b>Limite de abordagens por dia útil</b></label><input id="volume" type="text" inputmode="numeric" value="30"></div>
  </div>
  <div class="row two">
    <div><label for="cnaes"><b>Quantidade de CNAEs</b></label><input id="cnaes" type="text" inputmode="numeric" value="5"></div>
    <div></div>
  </div>
  <div style="margin-top:18px"><button class="btn" id="go" type="submit">Criar rascunho</button></div>
  <p class="msg e" id="msg"></p>
</form>
<section class="box"><h2 style="margin-top:0">Documentos criados</h2><div id="lista" class="muted">Carregando…</div></section>
<footer>ORBI IA · J. Marcelio Lima Ltda</footer>
</main>
<script>
const K=new URLSearchParams(location.search).get('k')||'';const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(body){const r=await fetch('/api/cg/doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:K,...body})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Erro');return j}
const ST={rascunho:'Rascunho',enviado:'Aguardando contratante',alteracao:'Sugestões para analisar',assinado_parte:'Falta sua assinatura',concluido:'Concluído',cancelado:'Cancelado'};
$('cnpj').addEventListener('blur',async()=>{const c=$('cnpj').value.replace(/\D/g,'');if(c.length!==14||$('razao').value)return;$('msg').textContent='Buscando dados do CNPJ…';
  try{const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c);if(!r.ok)throw 0;const j=await r.json();
   $('razao').value=j.razao_social||'';if(!$('fantasia').value)$('fantasia').value=(j.nome_fantasia||'').replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase());
   const end=[[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' '),j.numero,j.complemento,j.bairro,(j.municipio||'')+'/'+(j.uf||''),j.cep?'CEP '+String(j.cep).replace(/(\d{5})(\d{3})/,'$1-$2'):''].filter(x=>x&&String(x).trim()).join(', ');
   if(!$('endereco').value)$('endereco').value=end;$('msg').textContent=j.logradouro?'Confira o endereço antes de criar.':'Atenção: o CNPJ não trouxe a rua e o número. Complete o endereço à mão.'}catch(e){$('msg').textContent='Não achei esse CNPJ automaticamente. Preencha à mão.'}});
$('f').onsubmit=async e=>{e.preventDefault();const b=$('go');b.disabled=true;$('msg').textContent='';
  const v=id=>$(id).value.trim();
  try{const j=await api({acao:'novo',modelo:v('modelo'),valor:v('valor'),pagamento:v('pagamento'),extras:{mensalidade:v('mensalidade'),renovacao:v('renovacao'),vencimento:v('vencimento'),volume:v('volume'),cnaes:v('cnaes'),foro:v('foro')},parte:{razao:v('razao'),fantasia:v('fantasia'),cnpj:v('cnpj'),endereco:v('endereco'),representante:v('representante'),whatsapp:v('whatsapp')}});location.href=j.admin}
  catch(err){$('msg').textContent=err.message;b.disabled=false}};
api({acao:'listar',marca:'orbi'}).then(j=>{$('lista').innerHTML=j.docs.length?j.docs.map(d=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><a href="${d.admin}" style="color:var(--bone)">${esc(d.parte.fantasia)} · ${esc(d.titulo)}</a><br><span class="small">${ST[d.status]||d.status} · R$ ${Number(d.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>`).join(''):'Nenhum ainda.'}).catch(e=>{$('lista').textContent=e.message;$('f').classList.add('hidden')});
</script></body></html>
