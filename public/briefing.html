<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefing Pré-Visita — ORBI IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark:    #1E252E;
      --darker:  #161c23;
      --darkest: #0f1318;
      --green:   #4DB86A;
      --green2:  #3da058;
      --blue:    #5B76B8;
      --text:    #e8ecf0;
      --muted:   #6b7a8d;
      --border:  rgba(255,255,255,0.07);
    }
    html, body { min-height: 100vh; background: var(--darkest); color: var(--text); font-family: 'DM Sans', sans-serif; }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(77,184,106,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,184,106,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(77,184,106,0.08) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .wrapper {
      position: relative; z-index: 1;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 20px;
    }
    .card {
      width: 100%; max-width: 480px;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px;
      box-shadow: 0 0 0 1px rgba(77,184,106,0.06), 0 32px 80px rgba(0,0,0,0.5), 0 0 60px rgba(77,184,106,0.04);
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .logo { margin-bottom: 36px; }
    .logo img { height: 32px; width: auto; display: block; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(77,184,106,0.1); border: 1px solid rgba(77,184,106,0.2);
      color: var(--green); font-size: 11px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 100px; margin-bottom: 16px;
    }
    .badge::before {
      content: ''; width: 6px; height: 6px;
      background: var(--green); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 8px; letter-spacing: -0.02em; }
    .subtitle { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 36px; }
    .divider { height: 1px; background: var(--border); margin-bottom: 32px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 16px; }
    input[type="text"], input[type="tel"] {
      width: 100%; background: var(--darker); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 15px; padding: 13px 16px 13px 42px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="tel"]:focus {
      border-color: rgba(77,184,106,0.4);
      box-shadow: 0 0 0 3px rgba(77,184,106,0.08);
    }
    input::placeholder { color: rgba(107,122,141,0.6); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .btn {
      width: 100%; padding: 15px;
      background: var(--green); color: #0f1318;
      border: none; border-radius: 12px;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.04em; cursor: pointer; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(77,184,106,0.25);
    }
    .btn:hover:not(:disabled) { background: var(--green2); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(77,184,106,0.35); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #0f1318; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-label { display: none; }
    .feedback { margin-top: 20px; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; display: none; animation: fadeUp 0.3s ease both; }
    .feedback.success { display: block; background: rgba(77,184,106,0.1); border: 1px solid rgba(77,184,106,0.25); color: #7ddb96; }
    .feedback.error   { display: block; background: rgba(220,80,80,0.1);  border: 1px solid rgba(220,80,80,0.25);  color: #f07070; }
    .feedback strong { display: block; margin-bottom: 2px; }
    .footer { margin-top: 28px; font-size: 12px; color: rgba(107,122,141,0.5); text-align: center; letter-spacing: 0.03em; }
    @media (max-width: 520px) { .card { padding: 36px 24px; } h1 { font-size: 22px; } }
  </style>
</head>

      <div class="badge">Inteligência Eleitoral</div>
      <h1>Briefing Pré-Visita</h1>
      <p class="subtitle">Digite o município e seu WhatsApp. O briefing eleitoral completo chega em segundos.</p>
      <div class="divider"></div>

      <form id="form" autocomplete="off">
        <div class="field">
          <label for="municipio">Município</label>
          <div class="input-wrap">
            <span class="input-icon">📍</span>
            <input id="municipio" type="text" placeholder="Ex: Jaciara, Cuiabá, Poconé..." autocomplete="off" required />
          </div>
        </div>
        <div class="field">
          <label for="telefone">Seu WhatsApp</label>
          <div class="input-wrap">
            <span class="input-icon">📱</span>
            <input id="telefone" type="tel" placeholder="(65) 99999-9999" maxlength="16" required />
          </div>
          <p class="hint">O briefing será enviado para este número.</p>
        </div>
        <button type="submit" class="btn" id="btn">
          <span class="btn-label">⚡ Gerar Briefing</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="feedback" id="feedback"></div>
    </div>
    <div class="footer">ORBI IA — Mato Grosso · 2026</div>
  </div>

  <script>
    const telInput = document.getElementById('telefone');
    telInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g,'');
      if (v.length > 11) v = v.slice(0,11);
      if (v.length > 6)      v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
      else if (v.length > 2) v = '(' + v.slice(0,2) + ') ' + v.slice(2);
      else if (v.length > 0) v = '(' + v;
      e.target.value = v;
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const municipio = document.getElementById('municipio').value.trim();
      const telRaw    = document.getElementById('telefone').value.replace(/\D/g,'');
      const btn       = document.getElementById('btn');
      const feedback  = document.getElementById('feedback');

      if (telRaw.length < 10) {
        feedback.className = 'feedback error';
        feedback.innerHTML = '<strong>Número inválido</strong>Informe o DDD + número completo.';
        return;
      }

      const remoteJid = '55' + telRaw + '@s.whatsapp.net';
      btn.classList.add('loading');
      btn.disabled = true;
      feedback.className = 'feedback';
      feedback.style.display = 'none';

      const payload = {
        body: {
          data: {
            key: { remoteJid },
            message: { conversation: '//' + municipio }
          }
        }
      };

      try {
        const res = await fetch('https://orbi-prod-n8n.1vjiuq.easypanel.host/webhook/briefing-previsita', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok || res.status === 200) {
          feedback.className = 'feedback success';
          feedback.innerHTML = '<strong>✅ Briefing a caminho!</strong>Você receberá o briefing de <em>' + municipio + '</em> no WhatsApp em instantes.';
          document.getElementById('municipio').value = '';
          document.getElementById('telefone').value  = '';
        } else {
          throw new Error('Status ' + res.status);
        }
      } catch (err) {
        feedback.className = 'feedback error';
        feedback.innerHTML = '<strong>❌ Erro na requisição</strong>Tente novamente ou acione o suporte. (' + err.message + ')';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
