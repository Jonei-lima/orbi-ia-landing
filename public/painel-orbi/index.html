
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ORBI IA - 5888</title>
<style>
  :root {
    --verde: #25D366;
    --verde-escuro: #128C7E;
    --fundo: #f0f2f5;
    --painel: #ffffff;
    --texto: #111b21;
    --texto-sec: #667781;
    --borda: #e9edef;
    --bolha-user: #ffffff;
    --bolha-assistant: #d9fdd3;
    --bolha-manual: #cfe9ff;
    --perigo: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- TELA DE SENHA ---------- */
  #login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #128C7E, #075E54);
  }
  #login-box {
    background: var(--painel);
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    width: 320px;
    text-align: center;
  }
  #login-box h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  #login-box p {
    color: var(--texto-sec);
    font-size: 13px;
    margin: 0 0 24px;
  }
  #login-box input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
  }
  #login-box input:focus { border-color: var(--verde-escuro); }
  #login-box button {
    width: 100%;
    padding: 12px;
    background: var(--verde-escuro);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  #login-box button:hover { background: #0e6f61; }
  #login-error {
    color: var(--perigo);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- APP ---------- */
  #app {
    display: none;
    height: 100vh;
    width: 100vw;
  }
  #app.visible { display: flex; }

  #sidebar {
    width: 340px;
    min-width: 280px;
    background: var(--painel);
    border-right: 1px solid var(--borda);
    display: flex;
    flex-direction: column;
  }
  #sidebar-header {
    background: var(--verde-escuro);
    color: #fff;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sidebar-header h2 { font-size: 16px; margin: 0; }
  #sidebar-header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  #search-box {
    padding: 10px;
    border-bottom: 1px solid var(--borda);
  }
  #search-box input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    font-size: 13px;
    outline: none;
  }
  #leads-list {
    flex: 1;
    overflow-y: auto;
  }
  .lead-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borda);
    cursor: pointer;
  }
  .lead-item:hover { background: #f5f6f6; }
  .lead-item.active { background: #e9edef; }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--verde-escuro);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    flex-shrink: 0;
    font-size: 15px;
  }
  .lead-info { flex: 1; min-width: 0; }
  .lead-name {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lead-meta {
    font-size: 12px;
    color: var(--texto-sec);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge-pausada {
    font-size: 10px;
    background: #ffe1b3;
    color: #8a5a00;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 600;
  }
  .badge-segmento {
    font-size: 10px;
    background: #e3f3ff;
    color: #1a6ea0;
    padding: 2px 6px;
    border-radius: 10px;
    text-transform: capitalize;
  }
  #empty-leads {
    padding: 24px 16px;
    color: var(--texto-sec);
    font-size: 13px;
    text-align: center;
  }

  /* ---------- CONVERSA ---------- */
  #conversation {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #efeae2;
  }
  #conv-header {
    background: var(--painel);
    padding: 14px 20px;
    border-bottom: 1px solid var(--borda);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #conv-header .avatar { width: 38px; height: 38px; font-size: 13px; }
  #conv-title { font-size: 15px; font-weight: 600; }
  #conv-subtitle { font-size: 12px; color: var(--texto-sec); }
  #conv-header-actions { margin-left: auto; }
  #btn-reativar {
    background: var(--verde);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    display: none;
  }
  #btn-reativar:hover { background: #1fb856; }

  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--texto-sec);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg-row {
    display: flex;
    width: 100%;
  }
  .msg-row.out { justify-content: flex-end; }
  .msg-row.in { justify-content: flex-start; }
  .bubble {
    max-width: 60%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user { background: var(--bolha-user); border-top-left-radius: 0; }
  .bubble.assistant { background: var(--bolha-assistant); border-top-right-radius: 0; }
  .bubble.manual { background: var(--bolha-manual); border-top-right-radius: 0; }
  .bubble .meta {
    font-size: 10px;
    color: var(--texto-sec);
    margin-top: 4px;
    text-align: right;
  }
  .tag-manual {
    font-size: 9px;
    background: #1a6ea0;
    color: #fff;
    padding: 1px 5px;
    border-radius: 6px;
    margin-right: 4px;
  }

  #pausada-banner {
    display: none;
    background: #fff3cd;
    color: #8a5a00;
    padding: 8px 20px;
    font-size: 12px;
    text-align: center;
    border-top: 1px solid #f0e0a8;
  }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--painel);
    border-top: 1px solid var(--borda);
  }
  #input-bar textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    max-height: 90px;
  }
  #input-bar button {
    background: var(--verde-escuro);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #input-bar button:disabled { background: #aaa; cursor: not-allowed; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- TELA DE SENHA -->
<div id="login-screen">
  <div id="login-box">
    <h1>Painel ORBI IA</h1>
    <p>Acompanhamento WhatsApp &middot; 5888</p>
    <input type="password" id="password-input" placeholder="Senha" autocomplete="off">
    <button id="btn-login">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Leads &middot; 5888</h2>
      <button id="btn-refresh-leads">Atualizar</button>
    </div>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="Buscar por nome ou telefone...">
    </div>
    <div id="leads-list"></div>
  </div>

  <div id="conversation">
    <div id="placeholder">Selecione um lead na lista ao lado para ver a conversa.</div>

    <div id="conv-view" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div id="conv-header">
        <div class="avatar" id="conv-avatar">?</div>
        <div>
          <div id="conv-title">-</div>
          <div id="conv-subtitle">-</div>
        </div>
        <div id="conv-header-actions">
          <button id="btn-reativar">Reativar IA</button>
        </div>
      </div>
      <div id="messages"></div>
      <div id="pausada-banner">IA pausada para este lead &mdash; as respostas agora são manuais.</div>
      <div id="input-bar">
        <textarea id="msg-input" placeholder="Digite uma mensagem..." rows="1"></textarea>
        <button id="btn-send">&#10148;</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------- CONFIG ----------
  const N8N_BASE = "https://orbi-prod-n8n.1vjiuq.easypanel.host/webhook";
  const SECRET = "painel_orbi_x9K2mQ_2026";
  const PASSWORD_HASH = "c9cea56b4d0ca9453f8083f1ec122f5d14bfecc390f633bc8a2f9e77dba2adc1";
  const AUTH_KEY = "orbi_painel_auth";
  const POLL_MS = 15000;

  // ---------- HELPERS ----------
  async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  async function callWebhook(path, body) {
    const res = await fetch(`${N8N_BASE}/${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret: SECRET, ...body })
    });
    if (!res.ok) {
      let detail = "";
      try { detail = JSON.stringify(await res.json()); } catch (e) {}
      throw new Error(`Erro ${res.status} em ${path}. ${detail}`);
    }
    return res.json();
  }

  function initials(name) {
    if (!name) return "?";
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  }

  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " +
           d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // ---------- STATE ----------
  let leads = [];
  let selectedLeadId = null;
  let pollTimer = null;

  // ---------- LOGIN ----------
  const loginScreen = document.getElementById("login-screen");
  const appEl = document.getElementById("app");
  const pwInput = document.getElementById("password-input");
  const loginErr = document.getElementById("login-error");

  async function tryLogin(pw) {
    const hash = await sha256(pw);
    if (hash === PASSWORD_HASH) {
      localStorage.setItem(AUTH_KEY, "1");
      loginScreen.style.display = "none";
      appEl.classList.add("visible");
      boot();
    } else {
      loginErr.textContent = "Senha incorreta.";
      pwInput.value = "";
      pwInput.focus();
    }
  }

  document.getElementById("btn-login").addEventListener("click", () => tryLogin(pwInput.value));
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(pwInput.value); });

  if (localStorage.getItem(AUTH_KEY) === "1") {
    loginScreen.style.display = "none";
    appEl.classList.add("visible");
    boot();
  } else {
    pwInput.focus();
  }

  // ---------- BOOT ----------
  function boot() {
    loadLeads();
    document.getElementById("btn-refresh-leads").addEventListener("click", loadLeads);
    document.getElementById("search-input").addEventListener("input", renderLeads);
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById("btn-reativar").addEventListener("click", reativarIA);

    pollTimer = setInterval(() => {
      loadLeads(true);
      if (selectedLeadId) loadMessages(selectedLeadId, true);
    }, POLL_MS);
  }

  // ---------- LEADS ----------
  async function loadLeads(silent) {
    try {
      const data = await callWebhook("painel-listar-leads", {});
      leads = Array.isArray(data) ? data : (data.leads || []);
      renderLeads();
    } catch (e) {
      if (!silent) toast("Erro ao carregar leads: " + e.message);
      console.error(e);
    }
  }

  function renderLeads() {
    const q = document.getElementById("search-input").value.trim().toLowerCase();
    const list = document.getElementById("leads-list");
    list.innerHTML = "";

    const filtered = leads.filter(l => {
      if (!q) return true;
      const name = (l.confirmed_name || l.name || "").toLowerCase();
      const phone = (l.phone || "").toLowerCase();
      return name.includes(q) || phone.includes(q);
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div id="empty-leads">Nenhum lead encontrado.</div>`;
      return;
    }

    filtered.forEach(l => {
      const displayName = l.confirmed_name || l.name || l.phone || "Sem nome";
      const item = document.createElement("div");
      item.className = "lead-item" + (l.id === selectedLeadId ? " active" : "");
      item.innerHTML = `
        <div class="avatar">${escapeHtml(initials(displayName))}</div>
        <div class="lead-info">
          <div class="lead-name">
            ${escapeHtml(displayName)}
            ${l.ai_paused ? '<span class="badge-pausada">Pausada</span>' : ''}
          </div>
          <div class="lead-meta">
            ${l.segment ? `<span class="badge-segmento">${escapeHtml(l.segment)}</span> &middot; ` : ''}
            ${escapeHtml(l.phone || '')}
          </div>
        </div>
      `;
      item.addEventListener("click", () => selectLead(l.id));
      list.appendChild(item);
    });
  }

  function selectLead(id) {
    selectedLeadId = id;
    renderLeads();
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("conv-view").style.display = "flex";
    loadMessages(id);
  }

  // ---------- MENSAGENS ----------
  async function loadMessages(leadId, silent) {
    const lead = leads.find(l => l.id === leadId);
    if (lead) {
      const displayName = lead.confirmed_name || lead.name || lead.phone || "Sem nome";
      document.getElementById("conv-avatar").textContent = initials(displayName);
      document.getElementById("conv-title").textContent = displayName;
      document.getElementById("conv-subtitle").textContent =
        (lead.phone || "") + (lead.segment ? " · " + lead.segment : "");
      document.getElementById("btn-reativar").style.display = lead.ai_paused ? "inline-block" : "none";
      document.getElementById("pausada-banner").style.display = lead.ai_paused ? "block" : "none";
    }

    try {
      const data = await callWebhook("painel-listar-mensagens", { lead_id: leadId });
      const mensagens = Array.isArray(data) ? data : (data.mensagens || []);
      renderMessages(mensagens);
    } catch (e) {
      if (!silent) toast("Erro ao carregar mensagens: " + e.message);
      console.error(e);
    }
  }

  function renderMessages(mensagens) {
    const box = document.getElementById("messages");
    const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = "";

    mensagens.forEach(m => {
      const isOut = m.role === "assistant";
      const row = document.createElement("div");
      row.className = "msg-row " + (isOut ? "out" : "in");

      const bubbleClass = m.agent_type === "manual" ? "manual" : (isOut ? "assistant" : "user");
      const bubble = document.createElement("div");
      bubble.className = "bubble " + bubbleClass;
      bubble.innerHTML = `
        ${m.agent_type === "manual" ? '<span class="tag-manual">manual</span>' : ''}
        ${escapeHtml(m.message)}
        <div class="meta">${fmtTime(m.created_at)}</div>
      `;
      row.appendChild(bubble);
      box.appendChild(row);
    });

    if (wasNearBottom || mensagens.length <= 1) {
      box.scrollTop = box.scrollHeight;
    }
  }

  // ---------- ENVIAR ----------
  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !selectedLeadId) return;

    const lead = leads.find(l => l.id === selectedLeadId);
    if (!lead) return;

    const btn = document.getElementById("btn-send");
    btn.disabled = true;
    input.disabled = true;

    try {
      await callWebhook("painel-enviar-mensagem", {
        lead_id: selectedLeadId,
        phone: lead.phone,
        message: text
      });
      input.value = "";
      lead.ai_paused = true;
      await loadMessages(selectedLeadId, true);
      renderLeads();
      toast("Mensagem enviada. IA pausada para este lead.");
    } catch (e) {
      toast("Erro ao enviar: " + e.message);
      console.error(e);
    } finally {
      btn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  // ---------- REATIVAR IA ----------
  async function reativarIA() {
    if (!selectedLeadId) return;
    const btn = document.getElementById("btn-reativar");
    btn.disabled = true;
    try {
      await callWebhook("painel-reativar-ia", { lead_id: selectedLeadId });
      const lead = leads.find(l => l.id === selectedLeadId);
      if (lead) lead.ai_paused = false;
      document.getElementById("btn-reativar").style.display = "none";
      document.getElementById("pausada-banner").style.display = "none";
      renderLeads();
      toast("IA reativada para este lead.");
    } catch (e) {
      toast("Erro ao reativar: " + e.message);
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

})();
</script>
</body>
</html>
